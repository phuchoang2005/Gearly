<!--
  The Gearly transactional email layout. Placeholders: name, intro, actionUrl, actionLabel,
  disclaimer. See SmtpNotificationSender for which of them are escaped and why.

  Deliberately free of the placeholder syntax itself: this comment ships to recipients, and a
  comment that spells out the delimiters would have its own examples substituted.
-->
<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#0f0f0f; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 0;">
          <table width="600" cellpadding="40" cellspacing="0"
                 style="background-color:#ffffff; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.35);">

            <tr>
              <td align="center" style="padding-bottom:20px;">
                <h1 style="margin:0; color:#d70018; letter-spacing:1px;">
                  GEARLY
                </h1>
                <p style="margin:5px 0 0; color:#666; font-size:14px;">
                  PC Parts &amp; Performance Gear
                </p>
              </td>
            </tr>

            <tr>
              <td>
                <h2 style="color:#111;">Hello, {{name}}</h2>

                <p style="font-size:16px; color:#333; line-height:1.6;">
                  {{intro}}
                </p>

                <div style="text-align:center; margin:40px 0;">
                  <a href="{{actionUrl}}"
                     style="
                       display:inline-block;
                       background-color:#d70018;
                       color:#ffffff;
                       padding:14px 36px;
                       font-size:16px;
                       font-weight:600;
                       text-decoration:none;
                       border-radius:30px;
                       box-shadow:0 6px 18px rgba(215,0,24,0.45);
                     ">
                    {{actionLabel}}
                  </a>
                </div>

                <p style="font-size:14px; color:#555; line-height:1.6;">
                  {{disclaimer}}
                </p>

                <hr style="border:none; border-top:1px solid #e5e5e5; margin:40px 0;">

                <p style="font-size:12px; color:#888; text-align:center;">
                  &copy; 2025 Gearly. All rights reserved.<br>
                  High-Performance PC Store
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
