spring.application.name=Gearly
spring.data.mongodb.auto-index-creation=true

# Secret Key
jwt.secret=${JWT_SECRET}

# Login with Google
security.google.client-id=${GOOGLE_CLIENT_ID}

# Where this backend is reachable from a customer's mail client. Verification and
# password-reset links are built from it (identity/domain/VerificationLinks). It used to be
# "http://localhost:8080" compiled into EmailService, so mail from any deployed environment
# pointed at the recipient's own machine.
gearly.identity.public-base-url=${GEARLY_PUBLIC_BASE_URL:http://localhost:8080}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MongoDB Connection.
# Requires a replica set (`make up` starts one; see README "Transactions") — MongoDB has
# no multi-document transactions on a standalone server, so @Transactional would be inert.
# directConnection skips topology discovery; transactions still work against a member.
spring.data.mongodb.uri=mongodb://localhost:27017/gearly?directConnection=true

# Order pricing (gearly.pricing.*) — bound into the PricingPolicy domain service.
# Defaults live on the PricingProperties record so every profile gets the same numbers
# without repeating them; uncomment to override. Changing these changes what customers
# are charged, and the S8 characterization suite pins the current values.
#gearly.pricing.tax-rate=0.08
#gearly.pricing.free-shipping-threshold=30.00
#gearly.pricing.standard-shipping-cost=15.00

# CORS — comma-separated allowed origins (storefront + admin dev servers)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Momo Payment — bound into payments/infrastructure/MomoProperties.
# Property names unchanged from before S13, so no deployment needs reconfiguring.
momo.partnerCode=${MOMO_PARTNER_CODE:MOMO}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
momo.returnUrl=${MOMO_RETURN_URL:http://localhost:5173/momo-return}
momo.notifyUrl=${MOMO_NOTIFY_URL:}
# The create-payment endpoint. Defaults to the sandbox, as the hard-coded URL did; going
# live is a config change now rather than a code change.
momo.create-url=${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
momo.timeout=${MOMO_TIMEOUT:10s}

# USD->VND exchange rate (gearly.fx.*). The fallback reproduces the constant that used to be
# hard-coded in FxService. It is now a last resort behind a live quote and a cached one, and
# using it logs at ERROR — see OpenErApiExchangeRateProvider.
gearly.fx.api-url=${FX_API_URL:https://open.er-api.com/v6/latest/USD}
gearly.fx.fallback-usd-to-vnd=${FX_FALLBACK_USD_TO_VND:23000}
gearly.fx.timeout=${FX_TIMEOUT:5s}
gearly.fx.max-rate-age=${FX_MAX_RATE_AGE:12h}

# upload file
#vAllow files up to 10MB
spring.servlet.multipart.max-file-size=10MB
# And the whole request (including form data) up to 10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:uploads/

# File storage (gearly.storage.*) — one FileStorage port, two areas. Replaces app.avatar.*
# and the UPLOAD_DIR constant that MediaController carried.
#
# Everything written here is served from this application's own origin under /uploads/**,
# which is why the allow-list matters: before S13 there was none, so an .html or .svg
# avatar was same-origin markup the uploader controlled.
gearly.storage.max-file-size=${STORAGE_MAX_FILE_SIZE:5MB}
gearly.storage.allowed-content-types=image/jpeg,image/png,image/webp,image/gif,image/avif
gearly.storage.areas.product-images.directory=${STORAGE_PRODUCT_IMAGE_DIR:uploads}
gearly.storage.areas.product-images.public-base=/uploads
gearly.storage.areas.avatars.directory=${STORAGE_AVATAR_DIR:uploads/avatars}
gearly.storage.areas.avatars.public-base=/uploads/avatars

# GitHub Models (AI) — supplied via env; empty default so the context loads without a token
github.models.token=${GITHUB_MODELS_TOKEN:}
github.models.secondToken=${GITHUB_MODELS_SECOND_TOKEN:}
