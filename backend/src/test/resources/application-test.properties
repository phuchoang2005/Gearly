# Test profile — dummy values for the secrets that have no default in
# application.properties, so the Spring context can start without real env vars.
# MongoDB is supplied by Testcontainers via @ServiceConnection (overrides the URI),
# so no live database is required.

# HS256 needs a key >= 256 bits; this is a throwaway test key.
jwt.secret=test-jwt-secret-key-that-is-long-enough-32bytes

security.google.client-id=test-google-client-id

spring.mail.username=test@example.com
spring.mail.password=test-mail-password

momo.accessKey=test-momo-access-key
momo.secretKey=test-momo-secret-key
