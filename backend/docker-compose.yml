services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: no
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  spring-app:
    build: .
    container_name: spring-app
    restart: no
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/gearly
      SPRING_PROFILES_ACTIVE: docker
      # Secrets & config injected from backend/.env (see .env.example)
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMO}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-http://localhost:5173/momo-return}
      MOMO_NOTIFY_URL: ${MOMO_NOTIFY_URL:-}
      GITHUB_MODELS_TOKEN: ${GITHUB_MODELS_TOKEN:-}
      GITHUB_MODELS_SECOND_TOKEN: ${GITHUB_MODELS_SECOND_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
volumes:
  mongodb_data:
